[project]
name = "pythonprojectbank2"
version = "0.1.0"
description = ""
authors = [
    {name = "Александр Кокарев",email = "kokarev17@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.4,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pandas (>=2.3.0,<3.0.0)",
    "pytest (>=8.4.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.2.0"
pytest-cov = "^6.1.1"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.16.0"

[tool.mypy]
exclude = '.venv'
disallow_untyped_defs = 'True'
warn_return_any = 'True'

[tool.black]
line-length = 119


[tool.isort]
line_length = 119
